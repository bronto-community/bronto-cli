version: 2

project_name: bronto

before:
  hooks:
    - go mod tidy
    - sh -c "./scripts/completions.sh"

builds:
  - id: bronto
    main: ./cmd/bronto
    binary: bronto
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/bronto-community/bronto-cli/internal/version.Version={{ .Version }}
      - -X github.com/bronto-community/bronto-cli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/bronto-community/bronto-cli/internal/version.Date={{ .Date }}

archives:
  - id: bronto
    ids:
      - bronto
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - TRADEMARK.md
      - README.md
      - skill.md
      - llms.txt
      - src: completions/bronto.bash
        dst: completions/bronto.bash
      - src: completions/bronto.zsh
        dst: completions/bronto.zsh
      - src: completions/bronto.fish
        dst: completions/bronto.fish

checksum:
  name_template: checksums.txt

# Keyless (OIDC) cosign signature over the checksums file: verifying one
# signature transitively verifies every archive/package via its checksum.
# Certificate identity is the release workflow itself.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"

# SPDX SBOM per archive (syft), uploaded alongside the release assets.
sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

nfpms:
  - id: bronto
    ids:
      - bronto
    package_name: bronto
    vendor: bronto-cli contributors
    homepage: https://github.com/bronto-community/bronto-cli
    maintainer: bronto-cli contributors <noreply@github.com>
    description: Community CLI for the Bronto observability platform.
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: completions/bronto.bash
        dst: /usr/share/bash-completion/completions/bronto
      - src: completions/bronto.zsh
        dst: /usr/share/zsh/site-functions/_bronto
      - src: completions/bronto.fish
        dst: /usr/share/fish/vendor_completions.d/bronto.fish
      - src: LICENSE
        dst: /usr/share/doc/bronto/LICENSE
      - src: TRADEMARK.md
        dst: /usr/share/doc/bronto/TRADEMARK.md

homebrew_casks:
  - name: bronto
    ids:
      - bronto
    binaries:
      - bronto
    completions:
      bash: completions/bronto.bash
      zsh: completions/bronto.zsh
      fish: completions/bronto.fish
    repository:
      owner: bronto-community
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # auto = publish on stable tags, skip on pre-releases. HOMEBREW_TAP_TOKEN
    # is minted per-release from the Bronto Community Bot app in release.yml.
    skip_upload: auto
    homepage: https://github.com/bronto-community/bronto-cli
    # No trailing period — brew style rejects it (tap CI runs brew style).
    description: Community CLI for the Bronto observability platform
    # Strip the macOS Gatekeeper quarantine attribute on install. Homebrew
    # 5.0 deprecated the --no-quarantine flag and casks now quarantine
    # artifacts by default; the binary isn't Developer-ID notarized, so
    # without this a `brew install --cask` on macOS hits the "cannot verify"
    # dialog. The OS.mac? guard is required: xattr/quarantine are macOS-only
    # and running the hook unconditionally breaks `brew install` on Linux.
    #
    # Homebrew 7.0 deprecated the `postflight` block this renders into. The
    # tap's audit workflow rewrites this exact line into `postflight_steps`
    # in place (.github/scripts/postflight-steps.sh there), so keep it
    # byte-identical or update that script too. Don't move it to
    # custom_block: that lands at the top of the cask, and brew style's
    # stanza-order autocorrect can delete a moved postflight_steps block.
    # Switch to the native stanza once goreleaser/goreleaser#6870 ships
    # (v2.19.0) and the pin in release.yml is bumped.
    #
    # Written as a modifier `if` because the tap runs `brew style`, whose
    # Style/IfUnlessModifier cop rejects a multi-line `if` around a single
    # statement. At 98 characters it stays under the 118-char cask limit.
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path] if OS.mac?

scoops:
  - name: bronto
    ids:
      - bronto
    repository:
      owner: bronto-community
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    # Scoop's bucket layout keeps manifests under bucket/.
    directory: bucket
    # auto = publish on stable tags, skip on pre-releases, like the cask.
    # SCOOP_BUCKET_TOKEN is the same per-release Bronto Community Bot token
    # as HOMEBREW_TAP_TOKEN (see release.yml).
    skip_upload: auto
    homepage: https://github.com/bronto-community/bronto-cli
    description: Community CLI for the Bronto observability platform
    license: MIT

winget:
  - name: bronto
    ids:
      - bronto
    # winget-pkgs layout: manifests/<first letter>/<Publisher>/<Package>/<version>.
    # The identifier is permanent once published; renaming means a new package.
    package_identifier: BrontoCommunity.Bronto
    path: manifests/b/BrontoCommunity/Bronto/{{ .Version }}
    publisher: Bronto Community
    publisher_url: https://github.com/bronto-community
    publisher_support_url: https://github.com/bronto-community/bronto-cli/issues
    package_name: bronto CLI
    short_description: Community CLI for the Bronto observability platform
    license: MIT
    license_url: https://github.com/bronto-community/bronto-cli/blob/main/LICENSE
    homepage: https://docs.bronto.io/cli
    release_notes_url: https://github.com/bronto-community/bronto-cli/releases/tag/{{ .Tag }}
    tags:
      - bronto
      - cli
      - observability
      - logs
    commit_msg_template: "New version: {{ .PackageIdentifier }} version {{ .Version }}"
    # auto = publish on stable tags, skip on pre-releases, like the cask.
    # Without WINGET_TOKEN (a classic PAT; see release.yml) skip winget
    # entirely: the push to the fork would otherwise fail the release.
    skip_upload: '{{ if index .Env "WINGET_TOKEN" }}auto{{ else }}true{{ end }}'
    repository:
      # goreleaser pushes to this fork of microsoft/winget-pkgs, then opens a
      # PR upstream. Only a 422 (validation) from the PR call is downgraded to
      # a warning; any other failure (403, 5xx, a failed push) fails the
      # release command after the GitHub release is already published.
      owner: bronto-community
      name: winget-pkgs
      branch: "BrontoCommunity.Bronto-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

release:
  github:
    owner: bronto-community
    name: bronto-cli
  draft: false
  prerelease: auto

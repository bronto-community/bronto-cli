name: Docs
on:
  pull_request:
    # labeled/unlabeled re-run docs-required when `no-docs-needed` is added
    # or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - docs/**
      - internal/**
      - cmd/**
      - README.md
      - skill.md
      - llms.txt
      - Makefile
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - internal/**
      - cmd/**
      - README.md
      - skill.md
      - llms.txt
      - Makefile
      - .github/workflows/docs.yml

# Default every job to a read-only token; jobs needing more must say so.
permissions:
  contents: read

# One run per PR (or per main push). Label events get their own group, so
# adding `no-docs-needed` does not cancel an in-flight check of the same PR.
# On main every push runs to completion. There is no deploy job: the
# Mintlify dev site pulls docs/ from main through its GitHub app.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.sha }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'label' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ttyd for VHS recordings; checksum from the release's SHA256SUMS.
  TTYD_VERSION: 1.7.7
  TTYD_SHA256: 8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55
  VHS_VERSION: v0.12.1

jobs:
  # docs-check runs everything `make docs-check` covers: generated reference
  # is current, coverage, tested snippets against the docs mock, VHS tape
  # goldens, and Mintlify's strict build plus its link and anchor check.
  docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install VHS, ttyd and ffmpeg
        env:
          # vhs needs a newer Go than go.mod's toolchain line; setup-go sets
          # GOTOOLCHAIN=local, so let `go install` fetch what vhs asks for.
          GOTOOLCHAIN: auto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core jq
          curl -fsSL -o /tmp/ttyd "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "${TTYD_SHA256}  /tmp/ttyd" | sha256sum -c -
          sudo install -m 0755 /tmp/ttyd /usr/local/bin/ttyd
          go install "github.com/charmbracelet/vhs@${VHS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/vhs" --version
          ttyd --version
      - run: make docs-check
        env:
          # Ubuntu 24.04 blocks Chrome's user-namespace sandbox, which VHS
          # drives headless.
          VHS_NO_SANDBOX: "true"

  # docs-required fails a PR that changes user-facing CLI code without
  # touching the hand-written docs, unless it carries `no-docs-needed`.
  docs-required:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that docs changed with user-facing code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: scripts/docs-required.sh

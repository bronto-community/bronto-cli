name: Nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # integration-nightly runs the same black-box suite as ci.yml's
  # `integration` job, unattended and on its own schedule: it doubles as an
  # API-drift and dead-key detector (per the plan) even on days with no PRs,
  # and gives the eventual-consistency poll a longer budget
  # (BRONTO_IT_NIGHTLY=1 -> 10 minutes instead of 3 — see seedPollBudget in
  # integration/seed_test.go) since nothing here is blocking a PR merge.
  integration-nightly:
    runs-on: ubuntu-latest
    environment: bronto-it
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Same audit-mode-during-burn-in posture as ci.yml's `integration`
          # job; see that job's comment for the full rationale and the
          # exports --download presigned-URL trap.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build instrumented binary
        run: go build -cover -covermode=atomic -coverpkg=./... -o bronto.itest ./cmd/bronto

      - name: Run integration suite
        env:
          BRONTO_IT_BIN: ${{ github.workspace }}/bronto.itest
          GOCOVERDIR: ${{ github.workspace }}/covdata/int
          BRONTO_IT_NIGHTLY: "1"
          BRONTO_IT_MGMT_KEY: ${{ secrets.BRONTO_IT_MGMT_KEY }}
          BRONTO_IT_INGEST_KEY: ${{ secrets.BRONTO_IT_INGEST_KEY }}
          BRONTO_IT_REGION: ${{ vars.BRONTO_IT_REGION || 'eu' }}
        run: |
          mkdir -p "$GOCOVERDIR"
          # -timeout 20m: matches ci.yml — the live export leg runs ~8m,
          # too close to go test's default 10m package alarm.
          go test -count=1 -timeout 20m ./integration/

      # Keep artifacts on failure (and always, for consistency with ci.yml):
      # a failed nightly run is exactly the "API drift / dead key" signal
      # this job exists to catch, and the covdata + any test output are the
      # first thing to look at.
      - name: Upload integration covdata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-nightly-covdata
          path: covdata/int
          if-no-files-found: warn

  vuln-nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln

  # mutation-nightly is an ADVISORY quality signal — gremlins mutation
  # testing over the core-logic packages, estimating whether the tests would
  # CATCH a bug rather than merely run the code (which line coverage already
  # gates). continue-on-error so a slow/flaky run never turns the nightly
  # red: the score is a trend to watch, deliberately NOT a gate — its
  # timeout behavior is too flaky to wedge anything (the class of gate we
  # removed elsewhere). See scripts/mutation.sh and CONTRIBUTING.
  mutation-nightly:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run mutation testing
        run: make mutation | tee /tmp/mutation.log
      - name: Summarize mutation score
        if: always()
        run: |
          {
            echo "## Mutation testing (advisory)"
            echo
            echo '| Package | Efficacy | Mutant coverage |'
            echo '| --- | --- | --- |'
            awk '/^==> internal\// {pkg=$2}
                 /Test efficacy:/ {eff=$3}
                 /Mutator coverage:/ {print "| " pkg " | " eff " | " $3 " |"}' /tmp/mutation.log
          } >> "$GITHUB_STEP_SUMMARY"

  # report-failure turns a red nightly into an issue, so API drift, a dead
  # key or a new vulnerability doesn't sit unnoticed in the Actions tab.
  # One open issue collects every failure: a new failure comments on it
  # instead of opening another. Close the issue once the cause is fixed.
  # mutation-nightly is advisory (continue-on-error) and not watched here.
  report-failure:
    needs: [integration-nightly, vuln-nightly]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INTEGRATION: ${{ needs.integration-nightly.result }}
          VULN: ${{ needs.vuln-nightly.result }}
        run: |
          body=$(printf 'Nightly run failed: %s\n\n| Job | Result |\n| --- | --- |\n| integration-nightly | %s |\n| vuln-nightly | %s |\n' \
            "$RUN_URL" "$INTEGRATION" "$VULN")
          gh label create nightly-failure --color B60205 \
            --description "The scheduled nightly workflow failed" 2>/dev/null || true
          existing=$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Nightly workflow failed" --label nightly-failure --body "$body"
          fi

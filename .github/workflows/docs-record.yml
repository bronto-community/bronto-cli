# Re-records the docs' VHS videos against the live CI test account and
# opens a PR with the new docs/public/tapes/*.{webm,png}. The text goldens
# (docs/tapes/golden/) stay mock-based and are NOT touched: CI's
# docs-tapes-check compares them against a mock run, and a live account's
# data is not deterministic.
#
# Two jobs on purpose: `record` holds the live API keys but only a
# read-only token; `pull-request` can write to the repo but never sees the
# keys, and only receives the rendered files as an artifact.
#
# PRs opened with GITHUB_TOKEN do not trigger other workflows (GitHub's
# recursion guard); close and reopen the PR to run CI on it.
name: Docs videos (live)

on:
  workflow_dispatch:
    inputs:
      tapes:
        description: "Space-separated tape names (default: the live set in docs/tapes/record.sh)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docs-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    environment: bronto-it
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install vhs, ttyd, ffmpeg
        env:
          # setup-go pins GOTOOLCHAIN=local; vhs v0.12.1 needs a newer Go
          # than go.mod's, so let this one step auto-switch toolchains.
          GOTOOLCHAIN: auto
          VHS_VERSION: v0.12.1
          TTYD_VERSION: 1.7.7
          TTYD_SHA256: 8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core jq
          curl -fsSL -o /tmp/ttyd "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "${TTYD_SHA256}  /tmp/ttyd" | sha256sum -c -
          sudo install -m 0755 /tmp/ttyd /usr/local/bin/ttyd
          go install "github.com/charmbracelet/vhs@${VHS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Record tapes against the CI account
        env:
          BRONTO_IT_MGMT_KEY: ${{ secrets.BRONTO_IT_MGMT_KEY }}
          BRONTO_IT_INGEST_KEY: ${{ secrets.BRONTO_IT_INGEST_KEY }}
          BRONTO_IT_REGION: ${{ vars.BRONTO_IT_REGION || 'eu' }}
          TAPES: ${{ inputs.tapes }}
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's
          # sandbox needs; the headless browser only renders our own tapes.
          VHS_NO_SANDBOX: "true"
        run: make docs-tapes-live TAPES="$TAPES"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-tapes
          path: |
            docs/public/tapes/*.webm
            docs/public/tapes/*.png
          if-no-files-found: error
          retention-days: 7

  pull-request:
    needs: record
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-tapes
          path: docs/public/tapes

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          branch=docs/live-tapes
          if git diff --quiet -- docs/public/tapes && [ -z "$(git ls-files --others -- docs/public/tapes)" ]; then
            echo "::notice::Recorded videos are identical to $BASE; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -- docs/public/tapes/*.webm docs/public/tapes/*.png
          git commit -m "docs: re-record videos against the live CI account" \
            -m "Recorded by the docs-record workflow (run ${RUN_ID}). Text goldens are unchanged; they stay mock-based."
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          if [ -z "$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --base "$BASE" \
              --title "docs: re-record videos against the live CI account" \
              --body "Videos and poster frames re-recorded with \`make docs-tapes-live\` (workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}). Check that they show no account data that should not be public. Text goldens are untouched (they stay mock-based). Close and reopen this PR to run CI."
          fi

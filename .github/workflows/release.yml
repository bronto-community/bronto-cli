name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege at the top level; the release job below grants itself
# exactly the write scopes it needs. Scorecard's Token-Permissions check
# flags workflow-level write permissions as over-broad.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload assets
      packages: write # push images to ghcr (Docker Hub uses its own token)
      id-token: write # cosign keyless signing (OIDC) + provenance attestation
      attestations: write # actions/attest-build-provenance stores signed SLSA provenance
    # Gate the most credential-dense job in the repo (release token, the
    # cross-repo HOMEBREW_TAP_TOKEN, and OIDC signing) behind a protected
    # environment. Create a `release` environment with required reviewers in
    # repo Settings → Environments so a v* tag push can't mint these secrets
    # without a human approval. Until that environment has protection rules,
    # this line is a harmless no-op (GitHub auto-creates an open environment).
    environment: release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Audit during the same burn-in window as ci.yml's integration job;
          # this is the most credential-sensitive workflow, so it flips to
          # block first once the egress list is confirmed.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the TOOL, not just the installer action: the unpinned
          # 'latest' broke the v0.2.0 release when cosign v3 changed
          # sign-blob to require --bundle. v2.6.x produces the .sig/.pem
          # outputs our goreleaser signs block and SECURITY.md verification
          # depend on. Migrating to the v3 bundle format is deliberate
          # future work (goreleaser args + SECURITY.md together), and it
          # also needs bronto-community/setup-bronto-cli updated: that
          # action verifies the .sig/.pem pair with cosign v2.6.0.
          cosign-release: "v2.6.0"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Mint homebrew-tap and scoop-bucket token
        # Short-lived installation token from the Bronto Community Bot app,
        # scoped to contents:write on homebrew-tap and scoop-bucket only. The
        # default GITHUB_TOKEN cannot push cross-repo. Minting fails if the
        # app's installation lacks either repo, which fails the release.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: tap-token
        with:
          # The App ID lives as an ORG SECRET alongside the private key
          # (not a repo/org variable) — reading it from `vars.` broke the
          # first v0.2.3 release run with "appId option is required".
          app-id: ${{ secrets.BRONTO_COMMUNITY_BOT_APP_ID }}
          private-key: ${{ secrets.BRONTO_COMMUNITY_BOT_PRIVATE_KEY }}
          owner: bronto-community
          repositories: |
            homebrew-tap
            scoop-bucket
          permission-contents: write

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Exact-pinned for the same reason cosign is above: this is the
          # most credential-dense step in the repo (release token, tap
          # token, OIDC signing), so it must not float to whatever v2.x
          # was published last. Keep in sync with the Makefile's
          # release-dry/snapshot pin.
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          SCOOP_BUCKET_TOKEN: ${{ steps.tap-token.outputs.token }}

      # Signed SLSA build provenance for every release archive/package.
      # goreleaser's checksums.txt lists them all, so one attestation over
      # the checksum file covers each artifact — the same
      # verify-one-file-covers-all pattern as the cosign signature. Verify
      # with: gh attestation verify <artifact> --repo bronto-community/bronto-cli
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Stage docker build context
        # The image builds COPY these prebuilt binaries (goreleaser just
        # cross-compiled them natively) instead of compiling inside the
        # Dockerfile — in-image compilation ran under QEMU for arm64 and
        # cost ~8-10 minutes per release.
        run: |
          install -D dist/bronto_linux_amd64*/bronto docker-ctx/linux/amd64/bronto
          install -D dist/bronto_linux_arm64*/bronto docker-ctx/linux/arm64/bronto

      - name: Set image build metadata
        id: meta
        env:
          # Only checked for presence, never printed: Docker Hub is skipped
          # while the token isn't available to this repo.
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Every tag goes to each registry; the same build pushes the same
          # digests (and attestations) everywhere.
          IMAGES="ghcr.io/bronto-community/bronto-cli"
          DOCKERHUB=false
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            # Docker Hub namespaces are Docker Hub accounts, not GitHub orgs:
            # the image lives under the brontoio account.
            IMAGES="${IMAGES} docker.io/brontoio/bronto-cli"
            DOCKERHUB=true
          else
            echo "::notice::DOCKERHUB_TOKEN is not set; publishing to ghcr.io only."
          fi
          SCRATCH_TAGS=""
          DISTROLESS_TAGS=""
          for image in $IMAGES; do
            SCRATCH_TAGS="${SCRATCH_TAGS}${image}:${VERSION}"$'\n'
            DISTROLESS_TAGS="${DISTROLESS_TAGS}${image}:${VERSION}-distroless"$'\n'
            # Only stable releases (no pre-release suffix like -rc.1) move :latest.
            case "$GITHUB_REF_NAME" in
              *-*) ;;
              *)
                SCRATCH_TAGS="${SCRATCH_TAGS}${image}:latest"$'\n'
                DISTROLESS_TAGS="${DISTROLESS_TAGS}${image}:latest-distroless"$'\n'
                ;;
            esac
          done
          {
            echo "dockerhub=${DOCKERHUB}"
            echo "version=${VERSION}"
            echo "commit=${GITHUB_SHA}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "scratch_tags<<TAGS_$GITHUB_SHA"
            echo "$SCRATCH_TAGS"
            echo "TAGS_$GITHUB_SHA"
            echo "distroless_tags<<TAGS_$GITHUB_SHA"
            echo "$DISTROLESS_TAGS"
            echo "TAGS_$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub: a Read & Write personal access token of the shared brontoio
      # account, stored as org secrets shared with this repo (like the bot app
      # key), so they are not gated by the release environment's approval.
      # Moving them onto the release environment needs no change here. If
      # brontoio is converted
      # to an organization, that token stops working and must be replaced
      # with an organization access token (see #185).
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.meta.outputs.dockerhub == 'true'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (scratch image)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-ctx
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
          tags: ${{ steps.meta.outputs.scratch_tags }}
          # The Dockerfile LABELs land in each platform's image config, but
          # registries read a multi-arch image's metadata from the index:
          # without these, ghcr.io shows "No description provided".
          annotations: |
            index:org.opencontainers.image.description=Community CLI for the Bronto observability platform
            index:org.opencontainers.image.source=https://github.com/bronto-community/bronto-cli
            index:org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true

      - name: Build and push (distroless image)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-ctx
          file: Dockerfile.distroless
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
          tags: ${{ steps.meta.outputs.distroless_tags }}
          # Index annotations, as for the scratch image above.
          annotations: |
            index:org.opencontainers.image.description=Community CLI for the Bronto observability platform (distroless)
            index:org.opencontainers.image.source=https://github.com/bronto-community/bronto-cli
            index:org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true

  # dockerhub-description syncs DOCKERHUB.md to the Docker Hub page once the
  # images are published. Pre-releases don't move :latest, so they don't
  # touch the page either. soft-fail turns a failed sync into a warning, so
  # it can't fail the release.
  dockerhub-description:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    uses: ./.github/workflows/dockerhub-description.yml
    with:
      soft-fail: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # verify-release installs the release just published the way users do, with
  # the project's own GitHub Action (bronto-community/setup-bronto-cli), on
  # every runner OS/arch the release ships for. That covers the published
  # archives, checksums.txt and its cosign signature, and the action itself,
  # minutes after publishing instead of when a user reports a broken asset.
  # bronto-it has no protection rules, so this needs no second approval.
  verify-release:
    needs: release
    runs-on: ${{ matrix.runner }}
    environment: bronto-it
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'  # harden-runner is Linux-only
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Install the released bronto CLI
        id: setup
        uses: bronto-community/setup-bronto-cli@7c4488a88503e26a475db18d1e5402d03efc5477 # v1.0.1
        with:
          version: ${{ github.ref_name }}
          # ping reads GET /logs, which needs a management key; an
          # ingestion-only key gets 403.
          api-key: ${{ secrets.BRONTO_IT_MGMT_KEY }}
          region: ${{ vars.BRONTO_IT_REGION || 'eu' }}

      - name: Check version and reach the API
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `bronto version` prints JSON when stdout is not a terminal.
          got=$(bronto version | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
          [ "$got" = "${TAG#v}" ] || { echo "::error::bronto reports $got, expected ${TAG#v}"; exit 1; }
          bronto ping

# Hand-maintained "Learn more" links for the generated command reference
# (internal/tools/docgen, `make docs-reference`).
#
# Key: command path without the leading "bronto" (e.g. "datasets parser").
# Values, both optional:
#   docs: a docs.bronto.io page explaining the platform concept behind it
#   api:  the docs.bronto.io API reference page for the main endpoint it
#         calls (for a resource, the list operation)
# Only list pages that exist — verify with `curl -sI <url>` (HTTP 200).
# Subcommands without an entry inherit nothing; they get the links only
# if they are listed here themselves.
